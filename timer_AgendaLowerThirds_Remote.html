    <script id="vdoView">
        // This initial code is used to listen for messages via VDO.Ninja's iframe API for incoming p2p data.
        let iframe, gFormID;
        // Embedding VDO.Ninja iframe for receiving commands
        window.onload = function () {
            const paramsString = window.location.search;
            const searchParams = new URLSearchParams(paramsString);

            let VDO_ID = searchParams.get("vdoID");
            let VDO_PW = searchParams.get("vdoPW");
            gFormID = searchParams.get("googleForm");
            console.log("form ID", gFormID)
            let FULL_URL = `https://vdo.ninja/?statsinterval=20000&datamode&label=remoteController&view=${VDO_ID}&pw=${VDO_PW}`;

            iframe = document.createElement("iframe");
            // iframe.src = "https://vdo.ninja/?datamode&password=secret&view=" + streamID +"&label=OBS";
            iframe.src = FULL_URL;
            //iframe.style.display = "none"; // Hide the iframe
            iframe.id = "vdoIframe";
            document.body.appendChild(iframe);

            getSheetData();
        };
    </script>

    <script id="vdoSend">
        function sendCommandToOBS(command) {
            const iframe = document.getElementById("vdoIframe");
            if (iframe) {
                console.log("message to OBS: ", JSON.stringify(command));
                //iframe.contentWindow.postMessage({ "sendData": command }, '*');
                iframe.contentWindow.postMessage({"sendChat": JSON.stringify(command)}, '*');
            }
        }   

        // Example buttons for starting and stopping a broadcast
        let messageObj = { "from receiver1": "label?", "item2": "more" }
        function startBroadcast() { sendCommandToOBS(`${JSON.stringify(messageObj)}`); }
        function stopBroadcast() { sendCommandToOBS('StopStreaming'); }
    </script>
   
    <script >
        var startDateTime, endDateTime
        var table, varID, Interval, varSection, varNames, varName, varMinutes;
        var seconds, minutes;
        var timeGreen, timeYellow, timeRed, times, timeYellowMinutes, timeYellowSeconds
        var currentTableRow = 1;
        let timerReport = {};
        document.addEventListener("DOMContentLoaded", pageLoad);

        async function pageLoad() {
            //configure local storage
            setLocalStorage();
            //setupTimer()
            //await getVariables();
            //loadData();
        }

        function setLocalStorage(){
            let date = new Date;
            date = `${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2,0)}${date.getDate().toString().padStart(2,0)}`
            if(date !== localStorage.getItem("timerReportDate") || localStorage.getItem('timerReport') === null){
                localStorage.setItem("timerReportDate", date);
                localStorage.setItem("timerReport", ``);
            } else{ timerReport = JSON.parse(localStorage.getItem("timerReport"))}
        }

        function setupTimer() {
            var buttonStart = document.getElementById('button-start');
            //var buttonStop = document.getElementById('button-stop');
            var buttonReset = document.getElementById('button-reset');

            //get selected row duration
            //set timer to current duration
            minutes = document.getElementById("minutes").innerHTML;
            seconds = document.getElementById("seconds").innerHTML;
            var appendSeconds = document.getElementById("seconds")
            var appendMinutes = document.getElementById("minutes")

            buttonStart.onclick = function () {
                if (document.getElementById('button-start').innerHTML === 'Start') {
                    document.getElementById('button-start').innerHTML = 'Stop';
                    buttonReset.style.visibility = "hidden";
                    clearInterval(Interval);
                    startDateTime = GetDate();
                    times = varMinutes.split("-");
                    timeGreen = Number(times[0])
                    timeRed = Number(times[1])
                    numTimeRed = timeRed.toFixed(0)
                    console.log(`red: ${numTimeRed}`)
                    timeYellow = ((timeRed - timeGreen) / 2) + timeGreen
                    timeYellowSeconds = (timeYellow % 1) * 60
                    timeYellowMinutes = Math.floor(Number(timeYellow / 1))
                    console.log(`Green: ${timeGreen}, Yellow: ${timeYellowMinutes}:${timeYellowSeconds},Red: ${timeRed}`)
                    Interval = setInterval(startTimer, 1000);
                    return;
                }
                
                if (document.getElementById('button-start').innerHTML === 'Stop') {
                    document.getElementById('button-start').innerHTML = 'Start';
                    buttonReset.style.visibility = "visible";
                    endDateTime = GetDate()
                    const stopTime = document.getElementById("minutes").innerHTML + ":" + document.getElementById("seconds").innerHTML
                    table.updateData([{ id: varID, Duration: stopTime }]);
                    // google.script.run.AddRecordToResultsSheet({
                        //     Section: varSection,
                        //     Minutes: varMinutes,
                        //     Name: varName,
                        //     Start: startDateTime,
                        //     End: endDateTime,
                        //     Duration: stopTime,
                        //     RowID: varID
                        // });
                    clearInterval(Interval);
                    selectTableRow(currentTableRow);
                }


            }

            //   buttonStop.onclick = function() {
            //     endDateTime = GetDate()
            //     table.updateData([{ id: varID, Duration: document.getElementById("minutes").innerHTML +":" + document.getElementById("seconds").innerHTML }]);
            //     google.script.run.AddRecordToResultsSheet({
            //               Section: varSection,
            //               Minutes: varMinutes,
            //               Name: varName,
            //               Start: startDateTime,
            //               End: endDateTime
            //             });
            //     clearInterval(Interval);
            // }

            buttonReset.onclick = function () {
                clearInterval(Interval);
                // seconds = document.getElementById("seconds").innerHTML;
                // minutes = document.getElementById("minutes").innerHTML;
                // appendSeconds.innerHTML = seconds;
                // appendMinutes.innerHTML = minutes;
                //disable start button
                //select next table row
                //currentTableRow += 1;
                console.log("Current Row Variable:",currentTableRow)
                //table.deselectRow();
                selectTableRow(currentTableRow+1);
                //table.selectRow(table.getRowFromPosition(currentTableRow)); //return row in the visible table datacurrentTableRow);
                //activate timer?
            }

            function startTimer() {
                console.log("timer started seconds", seconds)
                seconds++;
                if (seconds <= 9) {
                    appendSeconds.innerHTML = "0" + seconds;
                }

                if (seconds > 9) {
                    appendSeconds.innerHTML = seconds;
                }

                if (seconds > 59) {
                    console.log("minutes");
                    minutes++;
                    appendMinutes.innerHTML = "0" + minutes;
                    seconds = 0;
                    appendSeconds.innerHTML = "0" + 0;
                }

                if (minutes > 9) {
                    appendMinutes.innerHTML = minutes;
                }
                console.log(minutes, timeGreen, minutes == timeGreen, minutes == timeYellowMinutes)
                switch (true) {
                    case (minutes >= timeRed && seconds == 0):
                        console.log("matched red");
                        /* google.script.run.setColor("Red", varNames.indexOf('Color')) */
                        sendCommandToOBS(`{"setColor": "Red"}`);
                        break;
                        case (minutes == timeYellowMinutes && seconds == timeYellowSeconds):
                            console.log("matched yellow")
                            sendCommandToOBS(`{"setColor": "Yellow"}`);
                        /* google.script.run.setColor("Yellow", varNames.indexOf('Color')) */
                        break;
                    case (minutes == timeGreen && seconds == 0):
                        console.log("matched green")
                        sendCommandToOBS(`{"setColor": "Green"}`);
                        /* google.script.run.setColor("Green", varNames.indexOf('Color')) */
                        break;
                }
            }


        }

        //called from the script getSheetData.js
        function loadData(headers, sheetData) {
            if(localStorage.getItem("timerReport")){
                const local_timerReport = JSON.parse(localStorage.getItem("timerReport"))
                console.log("sheet", sheetData)
                sheetData.forEach( (row, index) => {
                    console.log("sheetData row",typeof row, row)    
                    console.log("local report row",typeof index, index)    
                    row.id = index+1;
                    if(local_timerReport.hasOwnProperty(row.Section)){
                        if(local_timerReport[row.Section].duration !== undefined){
                            row.Duration = local_timerReport[row.Section].duration   
                        }  
                    }
                });
            }
            //if data successfully returned
            //create Tabulator on DOM element with id "example-table"
            table = new Tabulator("#agenda-table", {
                height: 2000, // set height of table (in CSS or here)
                rowHeight: 50,
                data: sheetData, //assign data to table
                layout: "fitColumns", //fit columns to width of table (optional)
                columns: [
                    //Define Table Columns
                    {
                        title: headers[1],
                        field: headers[1],
                        width: 150,
                        headerSort: false,
                    },
                    {
                        title: headers[2],
                        field: headers[2],
                        width: 70,
                        hozAlign: "left",
                        headerSort: false,
                    },
                    {
                        title: headers[3],
                        field: headers[3],
                        headerSort: false,
                        width: 150,
                    },
                    {
                        title: headers[4],
                        field: headers[4],
                        width: 150,
                        sorter: "date",
                        hozAlign: "center",
                        headerSort: false,
                        editor: "input",
                    },
                ],
            });

            //table built, select row 1
            table.on("tableBuilt", function () {
                table.deselectRow();
                table.selectRow(table.getRowFromPosition(1));
            });

            //Clicked table row
            table.on("rowClick", function (e, row) {

                console.log("e=index", row.getPosition())
                console.log("e", e)
                console.log("row", row)
                table.deselectRow();
                table.selectRow(table.getRowFromPosition(row.getPosition()));
                //rowChanged(row)
            });

            //Button moved selected table row
            table.on("rowSelected", function (row) { rowChanged(row) });

            //Duration manually changed
            table.on("cellEdited", function (cell) {
                console.log("row",cell.getRow().getPosition())
                console.log("cell changed Event", cell.getData())
                //refresh timer
                table.deselectRow();
                table.selectRow(cell.getRow().getPosition());
            })


            setupTimer();
            document.getElementById('greenButton').onclick = () => { sendCommandToOBS(`{"setColor": "Green"}`)};
            document.getElementById('yellowButton').onclick = () => { sendCommandToOBS(`{"setColor": "Yellow"}`); };
            document.getElementById('redButton').onclick = () => { sendCommandToOBS(`{"setColor": "Red"}`); };
            document.getElementById('whiteButton').onclick = () => { sendCommandToOBS(`{"setColor": "White"}`); };

        }

        function rowChanged(row) {

            console.log("rowSelected", row.getData().id);
            console.log("table object", table.getData());

            varSection = row.getData().Section;
            varMinutes = row.getData().Minutes;
            varName = row.getData().Name;
            const varDuration = row.getData().Duration;
            console.log("row details", varSection, varMinutes, varName, varDuration);
            const durationProp = "duration";
           
            timerReport[varSection] = {};
            timerReport[varSection][durationProp]= varDuration ;
           
            console.log("timerReportObject", timerReport)
            localStorage.setItem("timerReport", JSON.stringify(timerReport))
           
            console.log("dur",row)
            varID = row.getData().id;

            // google.script.run.setCurrentSection({
            //     Section: varSection
            //     //Minutes: varMinutes,
            //     //Name: varName,
            // }, varNames.indexOf('TimerSection'));

            // google.script.run.setColor("White", varNames.indexOf('Color'))
            sendCommandToOBS(`{"setColor": "White"}`);
            // google.script.run.setColor(varMinutes, varNames.indexOf('TimerMinutes'))
            // google.script.run.setColor(varName, varNames.indexOf('TimerName'))

            console.log(`row duration length ${varDuration}`)
            console.log("Row " + row.getData().Section + " selected");
            console.log("Row Position " + row.getPosition() );
            //console.log("Row " + row.getRow())

            if (varDuration === undefined) { table.updateData([{ id: varID, Duration: "00:00" }]) };
            const durationParts = varDuration.split(":")
            document.getElementById("minutes").innerHTML = durationParts[0]
            document.getElementById("seconds").innerHTML = durationParts[1]
            minutes = Number(durationParts[0])
            seconds = Number(durationParts[1])
            console.log('timer variables', minutes, seconds)
            const clockElemTitle = document.getElementById("SectionTitle");

            console.log(`section variable ${varSection}`)
            clockElemTitle.innerHTML = varSection

            var rowPos = row.getPosition();
            console.log(`row position: ${rowPos}`)
            console.log(`var currentTableRow position: ${rowPos-1}`)
            currentTableRow = row.getPosition();
            //change lower third slide to match selected row
            
            sendCommandToOBS(`{"setLowerThird": ${rowPos-1} }`);
        }

        function selectTableRow(row) {
            console.log("selectRow", row)    
            table.deselectRow();
            table.selectRow(table.getRowFromPosition(row));
        }

        function GetDate() {
            let dateTime = new Date().toJSON();
            date = dateTime.slice(0, 10)
            const time = dateTime.slice(-13, -5)
            dateTime = `${date} ${time}`
            return dateTime
        }

    </script>

<script id="submit Google Form">
    
    function submitGoogleForm() {
        // https://dev.to/utkarshdhiman48/custom-frontend-for-google-form-456l
        const url = `https://docs.google.com/forms/d/e/${gFormID}/formResponse`
        const formData = getInputData();
        
        fetch(url, {
            method:'Post',
            mode:'no-cors',
            headers:{
                'Content-Type':'application/json'
            },
            body: formData,
            redirect:"follow"
        })
            .then((response) => {
                console.log(response)
                if (response) {
                    alert('Form submitted successfully!');
                } else {
                    alert('Error submitting form.');
                }
            })
            .catch((error) => {
                console.error('There was an error:', error);
                alert('Network error. Please try again later.');
            });
    };

    //populating input data
    function getInputData() {
        let dataToPost = new FormData(); //formdata API

        //fill name attributes to corresponding values
        dataToPost.append("entry.1973965687", localStorage.getItem('timerReport'));
        return dataToPost;
    }
</script>
